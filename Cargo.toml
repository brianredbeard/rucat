[package]
name = "rucat"
version = "0.2.0"
authors = ["Brian 'redbeard' Harrington <redbeard@dead-city.org>"]
edition = "2024"
description = "rucat is 'cat' reborn for the era of LLMs. A critical tool for every prompt engineer."
categories = ["command-line-utilities", "development-tools", "science::ai", "text-processing"]
keywords = ["ai", "cat", "cli", "context", "formatter", "llm", "prompt", "syntax-highlighting", "utility"]
readme = "README.md"
repository = "https://github.com/brianredbeard/rucat"
license = "GPL-3.0-or-later"

[package.metadata.deb]
maintainer = "Brian 'redbeard' Harrington <redbeard@dead-city.org>"
copyright = "2024, Brian 'redbeard' Harrington <redbeard@dead-city.org>"
license-file = ["LICENSE", "4"]
changelog = "CHANGELOG.md"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/rucat", "usr/bin/", "755"],
    ["assets/man/rucat.1", "usr/share/man/man1/", "644"],
    ["assets/completions/bash/rucat", "usr/share/bash-completion/completions/", "644"],
    ["assets/completions/zsh/_rucat", "usr/share/zsh/site-functions/", "644"],
    ["assets/completions/fish/rucat.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["README.md", "usr/share/doc/rucat/", "644"],
]

[lib]
name = "rucat"
path = "src/lib.rs"

[[bin]]
name = "generate-assets"
path = "src/bin/generate-assets.rs"
required-features = ["generate-assets"]

[[bin]]
name = "generate-fixture"
path = "src/bin/generate-fixture.rs"
required-features = ["generate-fixture"]

[[test]]
name = "cli_config"
path = "tests/cli_config.rs"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]
basic = []
full = []
generate-assets = ["clap_complete", "clap_mangen"]
generate-fixture = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"
anyhow = "1.0"
walkdir = "2"
regex = "1.11.1"
syntect = { version = "5.2.0", features = ["default-fancy"] }
base64 = "0.22"
clap_complete = { version = "4.5", optional = true }
clap_mangen = { version = "0.2.29", optional = true }
arboard = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
# For extended attributes on Unix platforms
xattr = "1.0"
exacl = { version = "0.12.0", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
]}

[dependencies.dirs]
version = "6.0"
[dependencies.toml]
version = "0.9"
[dependencies.time]
version = "0.3"
features = ["local-offset", "formatting", "std"]
[dev-dependencies]
assert_cmd = "2"         # spawn compiled binary
predicates = { version = "3", features = ["diff"] }
tempfile    = "3"
